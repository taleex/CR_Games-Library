<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AJAX Email Validation</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: red; font-size: 14px; margin-top: 5px; display: none; }
        .success { color: green; font-size: 14px; margin-top: 5px; display: none; }
        .status { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        .test-buttons { margin-top: 20px; }
        button { margin-right: 10px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h2>Test AJAX Email Validation</h2>
    <p>This test page checks if the AJAX email validation endpoint is working correctly.</p>
    
    <div class="form-group">
        <label for="testEmail">Email:</label>
        <input type="email" id="testEmail" placeholder="Enter an email address">
        <div id="emailError" class="error">Este email já está em uso</div>
        <div id="emailSuccess" class="success">Email disponível</div>
    </div>
    
    <div class="status">
        <h4>Validation State:</h4>
        <p>Email Valid: <span id="stateEmail">false</span></p>
        <p>Email Exists: <span id="stateExists">false</span></p>
        <p>AJAX Response: <span id="ajaxResponse">-</span></p>
    </div>
    
    <div class="test-buttons">
        <button onclick="testEmail('test@example.com')">Test Existing Email</button>
        <button onclick="testEmail('newuser@example.com')">Test New Email</button>
        <button onclick="clearTest()">Clear Test</button>
    </div>

    <script>
        // Simulate the validation state object
        var validationState = {
            email: false,
            emailExists: false
        };

        // Test the actual AJAX endpoint
        function checkEmailExists(email, callback) {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "files/AJAX/existeEmail.php?m=" + email, true);
            
            document.getElementById("ajaxResponse").textContent = "Checking...";
            
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4) {
                    if (xhr.status == 200) {
                        const response = xhr.responseText.trim();
                        document.getElementById("ajaxResponse").textContent = "Response: '" + response + "'";
                        const exists = response !== "";
                        callback(exists);
                    } else {
                        document.getElementById("ajaxResponse").textContent = "Error: " + xhr.status;
                        callback(false);
                    }
                }
            };

            xhr.send();
        }

        function validateEmail(input) {
            const email = input.value;
            const errorElement = document.getElementById("emailError");
            const successElement = document.getElementById("emailSuccess");
            const emailRegex = /^([\w-]+(?:\.[\w-]+)*)@((?:[\w-]+\.)*\w[\w-]{0,66})\.([a-z]{2,6}(?:\.[a-z]{2})?)$/i;

            // Remove previous error styling
            errorElement.style.display = "none";
            successElement.style.display = "none";

            if (email === "") {
                errorElement.textContent = "Campo obrigatório";
                errorElement.style.display = "block";
                validationState.email = false;
                validationState.emailExists = false;
                updateStatus();
                return false;
            }

            if (emailRegex.test(email)) {
                // Check if email already exists
                checkEmailExists(email, function (exists) {
                    if (exists) {
                        errorElement.textContent = "Este email já está em uso";
                        errorElement.style.display = "block";
                        validationState.email = false;
                        validationState.emailExists = true;
                    } else {
                        successElement.style.display = "block";
                        validationState.email = true;
                        validationState.emailExists = false;
                    }
                    updateStatus();
                });
                return true;
            } else {
                errorElement.textContent = "Formato de E-mail inválido";
                errorElement.style.display = "block";
                validationState.email = false;
                validationState.emailExists = false;
                updateStatus();
                return false;
            }
        }

        function updateStatus() {
            document.getElementById("stateEmail").textContent = validationState.email;
            document.getElementById("stateExists").textContent = validationState.emailExists;
        }

        // Add event listener for input
        document.getElementById("testEmail").addEventListener("input", function () {
            validateEmail(this);
        });

        // Test functions
        function testEmail(email) {
            const input = document.getElementById("testEmail");
            input.value = email;
            validateEmail(input);
        }

        function clearTest() {
            const input = document.getElementById("testEmail");
            input.value = "";
            validationState.email = false;
            validationState.emailExists = false;
            updateStatus();
            document.getElementById("emailError").style.display = "none";
            document.getElementById("emailSuccess").style.display = "none";
            document.getElementById("ajaxResponse").textContent = "-";
        }
    </script>
</body>
</html>
